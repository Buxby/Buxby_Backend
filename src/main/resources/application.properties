
# =====================================
# Application
# =====================================

spring.application.name=Buxby_Backend

# Server
server.port=${PORT:8080}

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# 앱 간편 로그인이 끝나고 돌아갈 수 있는 앱 주소 (쉼표로 여러 개)
# Expo Go로 개발할 때만 exp:// 를 더한다 (예: buxby://,exp://). 운영 서버에는 넣지 않는다
app.mobile-redirect-prefixes=${MOBILE_REDIRECT_PREFIXES:buxby://}


# =====================================
# H2 Database - 기존 데이터 유지
# =====================================

# 파일형 DB 사용 (서버 재시작해도 데이터 유지)
spring.datasource.url=jdbc:h2:file:./data/buxby;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# =====================================
# Kakao OAuth2 Client
# =====================================

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_REST_API_KEY}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/kakao}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao

# Kakao OAuth2 Provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id


# =====================================
# Kakao Place Search API - V13
# =====================================

kakao.rest-api-key=${KAKAO_REST_API_KEY:}


# =====================================
# Google OAuth2 Client
# =====================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://buxby.vercel.app/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.client-name=Google


# =====================================
# Naver OAuth2 Client
# =====================================

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=${NAVER_REDIRECT_URI:{baseUrl}/login/oauth2/code/naver}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.provider=naver

# Naver OAuth2 Provider
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response


# =====================================
# External APIs
# =====================================

# TAGO
tago.api.key=${TAGO_API_KEY:}

# Gyeonggi Bus Information System
gbis.api.key=${GBIS_API_KEY:}

# Incheon Bus Information System
incheon.bus.api.key=${INCHEON_BUS_API_KEY:}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
# 기본 모델이 혼잡(429/503)하거나 응답이 없으면 차례로 시도하는 모델
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemini-flash-lite-latest}

# ODsay
odsay.api.key=${ODSAY_API_KEY:}
odsay.referer=${ODSAY_REFERER:}

# Seoul Subway
subway.api.key=${SEOUL_SUBWAY_API_KEY:}


# =====================================
# Bus Congestion Scheduler
# =====================================

bus.congestion.scheduler.enabled=${BUS_CONGESTION_SCHEDULER_ENABLED:false}

bus.congestion.scheduler.route-ids=${BUS_CONGESTION_SCHEDULER_ROUTE_IDS:100100521}

bus.congestion.scheduler.fixed-delay-ms=${BUS_CONGESTION_SCHEDULER_FIXED_DELAY_MS:300000}

bus.congestion.scheduler.initial-delay-ms=${BUS_CONGESTION_SCHEDULER_INITIAL_DELAY_MS:60000}

# 혼잡도 기록 보관 기간 (이보다 오래된 기록은 매일 새벽 4시에 삭제)
bus.congestion.retention-days=${BUS_CONGESTION_RETENTION_DAYS:7}


# =====================================
# Scheduler
# =====================================

# 기본 스케줄러 스레드는 1개라서, 알람 점검이 외부 API를 기다리면 다른 스케줄러도 멈춘다
spring.task.scheduling.pool.size=4


# =====================================
# Session Cookie
# =====================================

server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.servlet.session.cookie.http-only=true
