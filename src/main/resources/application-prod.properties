# 배포 환경 설정 (SPRING_PROFILES_ACTIVE=prod 일 때 application.properties 위에 덮어씀)

# PostgreSQL (예: DB_URL=jdbc:postgresql://호스트:5432/DB이름)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 콘솔은 배포 서버에서 끈다 (Swagger UI는 켜 둠: 백엔드 주소 / 로 들어가면 열림)
spring.h2.console.enabled=false

# Vercel 프록시 뒤에서 원래 주소(https, 프론트 도메인)를 기준으로 간편 로그인 콜백 주소를 만든다
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# ODsay URI 키 인증용 (ODsay 콘솔에 등록한 도메인)
odsay.referer=${ODSAY_REFERER:https://buxby-backend.onrender.com}
